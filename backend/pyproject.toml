[project]
name = "pickshot-backend"
version = "0.1.0"
description = "AI Backend service for PickShot auto-curation and pairwise dataset flywheel"
authors = [{ name = "PickShot Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sse-starlette>=2.2.0",
    "pillow>=11.1.0",
    "numpy>=2.2.0",
    "opencv-python-headless>=4.11.0",
    "mediapipe>=0.10.20",
    "sqlalchemy>=2.0.38",
    "asyncpg>=0.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
